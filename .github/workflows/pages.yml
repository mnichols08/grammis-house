# Builds this blog with open.blog and publishes it to GitHub Pages.
# Written by `openblog init --github-pages`; edit freely.
#
# Runs on every push to main, and once an hour so posts with a future `date`
# go live on time (a scheduled post is published by the first build after its
# date). One-time setup: in the repository settings, under Pages, set Source to
# "GitHub Actions". Set "url" in openblog.json to the site's address; for a
# project site that is https://<user>.github.io/<repo>, and the build derives
# the path from it. For a custom domain, put the domain in static/CNAME.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The open.blog engine this site was tested with. Grammi's site is a real reader-facing
# site, so it upgrades on purpose: change this, build locally, then push.
# This is the commit of journey-to-code-org/open.blog#657 (greeting cards), stacked on #655,
# #654, #653, #652, #651 and #649. Once they're merged, point this at the merge commit on main.
env:
  OPENBLOG_REV: 65373fd55d0be0835f512ccd452a4770f9db3c11
  # Notes on recipes (hosted comments) and greeting cards run on Netlify. They're off until scripts/setup-family-service.sh
  # has been run: it sets the repository variable NETLIFY_SITE_ID and the secret NETLIFY_AUTH_TOKEN.
  NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The binary is cached so the engine is compiled once, not on every push.
      # Bump the key (or delete the cache) to pick up a newer open.blog.
      - name: Cache the openblog build
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/openblog
          key: openblog-${{ runner.os }}-${{ env.OPENBLOG_REV }}
      - name: Install openblog
        run: command -v openblog || cargo install --git https://github.com/journey-to-code-org/open.blog --rev "$OPENBLOG_REV" openblog-cli
      - name: Restore view counts from the analytics branch, if there is one
        run: |
          if git fetch -q origin analytics:analytics 2>/dev/null; then
            mkdir -p .openblog && git show analytics:analytics.json > .openblog/analytics.json
          fi
      - name: Install the Zubra compiler
        # Renders theme components (the countdown sign) into the page at build time, so the sign is
        # there before its script runs and in Admin's preview (open.blog ADR 0409).
        run: npm install --global @zubra/compiler@5.8.0
      - name: Build the site
        run: openblog build
      - name: Deploy the family notes service to Netlify
        # Off until NETLIFY_SITE_ID is set. The function is open.blog's own (netlify/functions), at the
        # same commit as the engine; Netlify also keeps a copy of the site, which nobody needs to visit.
        if: env.NETLIFY_SITE_ID != ''
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          git clone -q https://github.com/journey-to-code-org/open.blog "$RUNNER_TEMP/openblog"
          git -C "$RUNNER_TEMP/openblog" checkout -q "$OPENBLOG_REV"
          cd "$RUNNER_TEMP/openblog"
          npx -y netlify-cli@17 deploy --prod --no-build --dir "$GITHUB_WORKSPACE/dist" \
            --functions netlify/functions --site "$NETLIFY_SITE_ID"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
